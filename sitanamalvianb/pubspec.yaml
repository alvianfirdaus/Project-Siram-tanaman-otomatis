name: sitanamalvianb
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # ✅ Firebase (Versi stabil dan cocok untuk Flutter 3.16.4 dan Dart 3.4.x)
  firebase_core: ^2.31.0
  firebase_auth: ^4.17.0
  firebase_database: ^10.5.0

  # ✅ Utility packages
  flutter_switch: ^0.3.2
  tflite_flutter: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.3.0
  intl: ^0.19.0
  camera: ^0.10.5+9
  fl_chart: ^0.63.0
  lucide_icons: ^0.257.0
  shared_preferences: ^2.2.2
  mobile_scanner: ^3.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/sitanam.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/bg1.jpg
